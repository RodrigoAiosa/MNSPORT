<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MNSPORT · Futebol brasileiro</title>
<style>
  :root {
    --bg: #ffffff;
    --sub: #f4f5f6;
    --ink: #15191e;
    --mut: #5b646d;
    --line: #e5e7ea;
    --acc: #0a6b47;
    --neg: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1214;
      --sub: #181c20;
      --ink: #eceff1;
      --mut: #98a2ab;
      --line: #262c31;
      --acc: #3dbe8b;
      --neg: #f2766e;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  td:not(:nth-child(2)), .g .s, .g .d { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 20px 72px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 6px; }

  .mark { font-weight: 700; letter-spacing: .04em; font-size: 15px; }
  h1 { font-size: clamp(26px, 5vw, 34px); line-height: 1.15; letter-spacing: -.01em; margin: 40px 0 24px; font-weight: 700; }

  /* Controles: o que ver (competição, ano) e como ver (abas) */
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  .seg { display: inline-flex; background: var(--sub); border-radius: 10px; padding: 3px; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg span {
    display: grid; place-items: center; min-height: 40px; padding: 0 14px;
    border-radius: 8px; color: var(--mut); font-weight: 500; font-size: 15px; white-space: nowrap;
  }
  .seg input:checked + span { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .seg input:focus-visible + span { outline: 2px solid var(--acc); outline-offset: 2px; }
  @media (hover: hover) { .seg input:not(:checked):not(:disabled):hover + span { color: var(--ink); } }

  select, input[type=search] {
    min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink); font: inherit; font-size: 15px;
  }
  input[type=search] { min-width: 0; flex: 1 1 180px; }
  input[type=search]::placeholder { color: var(--mut); }

  .tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin: 28px 0 0; }
  .tabs label { position: relative; }
  .tabs input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .tabs span { display: block; padding: 10px 0 12px; color: var(--mut); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs input:checked + span { color: var(--ink); border-color: var(--ink); }
  .tabs input:disabled + span { opacity: .45; }
  .tabs input:disabled { cursor: not-allowed; }
  .tabs input:focus-visible + span { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 4px; }

  main { min-height: 420px; padding-top: 8px; }

  /* Classificação */
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 13px; font-weight: 500; color: var(--mut); text-align: right; padding: 14px 6px 8px; }
  th abbr { text-decoration: none; }
  td { padding: 0 6px; height: 48px; text-align: right; border-top: 1px solid var(--line); }
  .st th:nth-child(1), .st td:nth-child(1) { width: 36px; text-align: left; padding-left: 10px; color: var(--mut); }
  .st th:nth-child(2), .st td:nth-child(2) { text-align: left; }
  .pl th:first-child, .pl td:first-child { text-align: left; padding-left: 10px; }
  .pl td:first-child { height: 56px; }
  .pl .pos { display: block; color: var(--mut); font-size: 13px; line-height: 1.2; }
  .pl .nm { font-weight: 500; line-height: 1.3; }
  .pl td.z { color: var(--mut); }
  .pl th.on { color: var(--ink); }
  .pl th { padding-top: 6px; padding-bottom: 0; }
  button.sort { all: unset; cursor: pointer; padding: 8px 4px; }
  button.sort:hover { color: var(--ink); }
  button.sort:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 4px; }
  td:last-child, th:last-child { padding-right: 10px; }
  td.pts { font-weight: 700; }
  th.prob, td.prob { padding-left: 14px; }
  td.prob { font-weight: 600; color: var(--acc); }
  td.prob.zero { color: var(--mut); font-weight: 400; }
  .note { margin: 12px 10px 0; color: var(--mut); font-size: 14px; max-width: 60ch; }
  tr.lead td:first-child { box-shadow: inset 3px 0 0 var(--acc); color: var(--ink); font-weight: 700; }
  tr.down td:first-child { box-shadow: inset 3px 0 0 var(--neg); }
  button.team {
    all: unset; cursor: pointer; font-weight: 500; padding: 12px 0; display: inline-block; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  button.team:hover { text-decoration: underline; text-underline-offset: 3px; }
  button.team:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 4px; }
  .legend { display: flex; gap: 20px; margin: 16px 10px 0; color: var(--mut); font-size: 14px; }
  .legend i { display: inline-block; width: 3px; height: 14px; border-radius: 2px; margin-right: 8px; vertical-align: -2px; }

  /* Jogos */
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 0 4px; }
  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .stepper button {
    width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
    color: var(--ink); font-size: 20px; cursor: pointer;
  }
  .stepper button:disabled { opacity: .35; cursor: not-allowed; }
  .stepper select { min-width: 150px; }
  .day { font-size: 14px; font-weight: 500; color: var(--mut); margin: 28px 0 4px; text-transform: none; }
  ul.games { list-style: none; margin: 0; padding: 0; }
  .g { display: grid; grid-template-columns: 1fr 64px 1fr; align-items: center; gap: 8px; min-height: 52px; border-top: 1px solid var(--line); }
  .g.wd { grid-template-columns: 48px 1fr 64px 1fr; }
  .g .d { color: var(--mut); font-size: 14px; white-space: nowrap; }
  .g .h { text-align: right; } .g .a { text-align: left; }
  .g .h, .g .a { min-width: 0; overflow-wrap: break-word; }
  .g .s { text-align: center; font-weight: 700; font-size: 17px; }
  .g .s.muted { font-weight: 400; font-size: 14px; color: var(--mut); }
  .g .w { font-weight: 700; }

  /* Tooltip de jogador */
  #tip {
    position: fixed; z-index: 10; display: none; align-items: center; gap: 12px; max-width: 300px;
    padding: 10px 14px 10px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .18); pointer-events: none;
  }
  #tip.on { display: flex; }
  #tip .ph { width: 72px; height: 72px; flex: none; border-radius: 50%; background: var(--sub); object-fit: cover;
    display: grid; place-items: center; color: var(--mut); font-weight: 600; font-size: 22px; }
  #tip .tn { font-weight: 600; line-height: 1.25; }
  #tip .ts { color: var(--mut); font-size: 14px; }
  .pl tbody tr[data-photo]:hover, .pl tbody tr[data-photo]:focus-visible { background: var(--sub); outline: none; }

  /* Estados */
  .state { padding: 56px 0; max-width: 440px; }
  .state h2 { font-size: 18px; margin: 0 0 6px; }
  .state p { margin: 0 0 20px; color: var(--mut); }
  .btn {
    min-height: 44px; padding: 0 18px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--ink); color: var(--bg); font: inherit; font-weight: 600; font-size: 15px;
  }
  .skel { display: grid; gap: 0; }
  .skel div { height: 48px; border-top: 1px solid var(--line); display: flex; align-items: center; }
  .skel div::after { content: ""; height: 12px; width: var(--w, 60%); border-radius: 6px; background: var(--sub); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .skel div::after { animation: none; } }

  footer { margin-top: 56px; color: var(--mut); font-size: 14px; }
  footer a { color: inherit; }

  @media (max-width: 600px) {
    .x { display: none; }
    .wrap { padding: 16px 16px 56px; }
    h1 { margin-top: 28px; }
    .seg span { padding: 0 11px; font-size: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">MNSPORT</div>
  <h1 id="title">Brasileirão Série A</h1>

  <div class="controls">
    <fieldset class="seg" id="div">
      <legend class="sr">Competição</legend>
      <label><input type="radio" name="division" value="br1"><span>Série A</span></label>
      <label><input type="radio" name="division" value="br2"><span>Série B</span></label>
      <label><input type="radio" name="division" value="brcup"><span>Copa do Brasil</span></label>
    </fieldset>
    <label class="sr" for="season">Temporada</label>
    <select id="season"></select>
  </div>

  <fieldset class="tabs" id="view">
    <legend class="sr">Visualização</legend>
    <label><input type="radio" name="view" value="standings"><span>Classificação</span></label>
    <label><input type="radio" name="view" value="matches"><span>Jogos</span></label>
    <label><input type="radio" name="view" value="players"><span>Jogadores</span></label>
  </fieldset>

  <main id="out" aria-live="polite"></main>

  <footer>Dados: <a href="https://github.com/openfootball/south-america">openfootball</a>, domínio público. Jogos sem placar na fonte aparecem com “–”.</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const THIS_YEAR = new Date().getFullYear();
const DIV_NAME = { br1: "Brasileirão Série A", br2: "Brasileirão Série B", brcup: "Copa do Brasil" };

/* ---------- estado (compartilhável pela URL) ---------- */
const state = { season: THIS_YEAR, div: "br1", view: "standings", team: "", round: null, pteam: "", sort: "minutes" };
(function readHash() {
  const [s, d, v] = location.hash.slice(1).split("/");
  if (/^\d{4}$/.test(s)) state.season = +s;
  if (DIV_NAME[d]) state.div = d;
  if (v === "matches" || v === "standings" || v === "players") state.view = v;
})();
function writeHash() { history.replaceState(null, "", `#${state.season}/${state.div}/${state.view}`); }

/* ---------- nomes como o torcedor conhece ---------- */
const ALIAS = {
  "CA Mineiro": "Atlético-MG", "CA Paranaense": "Athletico-PR", "SC Corinthians Paulista": "Corinthians",
  "SC Internacional": "Internacional", "Grêmio FBPA": "Grêmio", "CR Vasco da Gama": "Vasco",
  "SC Recife": "Sport", "CR Flamengo": "Flamengo", "SE Palmeiras": "Palmeiras", "Clube do Remo": "Remo",
  "Atlético Mineiro": "Atlético-MG", "Athletico Paranaense": "Athletico-PR"
};
const AFFIX = new Set(["CR","SE","SC","EC","CA","RB","FC","FR","FBC","AF","EC","FBPA","AC"]);
function short(name) {
  if (ALIAS[name]) return ALIAS[name];
  const p = name.split(" ");
  while (p.length > 1 && AFFIX.has(p[0])) p.shift();
  while (p.length > 1 && AFFIX.has(p[p.length - 1])) p.pop();
  return p.join(" ");
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function roundLabel(r) {
  let m;
  if ((m = /^Matchday (\d+)$/.exec(r))) return `Rodada ${m[1]}`;
  if ((m = /^Round (\d+)$/.exec(r))) return `Fase ${m[1]}`;
  return { "Round of 16": "Oitavas de final", "Quarter-finals": "Quartas de final", "Semi-finals": "Semifinais", "Final": "Final" }[r] || r;
}
const dayLabel = iso => new Date(iso + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "short", day: "numeric", month: "long" });

/* ---------- dados (cache em memória: segunda visita é instantânea) ---------- */
const cache = new Map();
let reqId = 0;
async function getData(view, team = "") {
  const key = `${view}|${state.season}|${state.div}|${team}`;
  if (cache.has(key)) return cache.get(key);
  const r = await fetch(`/api/${view}?season=${state.season}&division=${state.div}` + (team ? `&team=${encodeURIComponent(team)}` : ""));
  let body; try { body = await r.json(); } catch { body = null; }
  if (!r.ok) { const e = new Error(body?.error || r.status); e.notFound = /404/.test(e.message); e.code = body?.code; throw e; }
  cache.set(key, body);
  return body;
}

/* ---------- renderização ---------- */
function skelHTML() {
  const w = [70, 55, 80, 62, 74, 50, 66, 58];
  return `<div class="skel" role="status" aria-label="Carregando">${w.map(x => `<div style="--w:${x}%"></div>`).join("")}</div>`;
}
function skeleton() { $("#out").innerHTML = skelHTML(); }
function showError(e) {
  const name = DIV_NAME[state.div];
  const prev = state.season - 1;
  $("#out").innerHTML = e.notFound
    ? `<div class="state"><h2>Ainda não há dados de ${esc(name)} em ${state.season}.</h2><p>A fonte pública não tem essa temporada.</p><button class="btn" data-season="${prev}">Ver ${prev}</button></div>`
    : `<div class="state"><h2>Não foi possível carregar os dados.</h2><p>A fonte pública não respondeu. Tente de novo em alguns instantes.</p><button class="btn" id="retry">Tentar novamente</button></div>`;
}

const pct = p => p >= 0.995 ? "100%" : p >= 0.01 ? Math.round(p * 100) + "%" : p > 0 ? "<1%" : "–";
const dayShort = iso => new Date(iso + "T12:00:00").toLocaleDateString("pt-BR", { day: "numeric", month: "short" }).replace(".", "");
function standingsHTML(rows) {
  if (!rows.length) return `<div class="state"><h2>Sem jogos disputados ainda.</h2><p>A classificação aparece assim que houver placares.</p></div>`;
  const n = rows.length, hasZone = state.div !== "brcup" && n >= 16;
  const hasP = rows.some(r => r.p_title != null);
  const asOf = hasP ? rows[0].as_of : null;
  const body = rows.map(r => {
    const cls = hasZone ? (r.pos === 1 ? "lead" : r.pos > n - 4 ? "down" : "") : "";
    return `<tr class="${cls}"><td>${r.pos}</td>
      <td><button class="team" data-team="${esc(r.team)}" title="Ver jogos do ${esc(short(r.team))}">${esc(short(r.team))}</button></td>
      <td>${r.pj}</td><td>${r.v}</td><td class="x">${r.e}</td><td class="x">${r.d}</td>
      <td class="x">${r.gp}</td><td class="x">${r.gc}</td><td>${r.sg > 0 ? "+" : ""}${r.sg}</td><td class="pts">${r.pts}</td>${hasP ? `<td class="prob ${r.p_title > 0 ? "" : "zero"}">${pct(r.p_title)}</td>` : ""}</tr>`;
  }).join("");
  return `<table class="st"><caption class="sr">Classificação ${esc(DIV_NAME[state.div])} ${state.season}</caption>
    <thead><tr><th scope="col"><abbr title="Posição">#</abbr></th><th scope="col">Time</th>
    <th scope="col"><abbr title="Jogos">J</abbr></th><th scope="col"><abbr title="Vitórias">V</abbr></th>
    <th scope="col" class="x"><abbr title="Empates">E</abbr></th><th scope="col" class="x"><abbr title="Derrotas">D</abbr></th>
    <th scope="col" class="x"><abbr title="Gols pró">GP</abbr></th><th scope="col" class="x"><abbr title="Gols contra">GC</abbr></th>
    <th scope="col"><abbr title="Saldo de gols">SG</abbr></th><th scope="col">Pts</th>${hasP ? `<th scope="col" class="prob"><abbr title="Chance de ser campeão, estimada por simulação">Título</abbr></th>` : ""}</tr></thead><tbody>${body}</tbody></table>
    ${hasZone ? `<div class="legend"><span><i style="background:var(--acc)"></i>Líder</span><span><i style="background:var(--neg)"></i>Rebaixamento</span></div>` : ""}
    ${hasP ? `<p class="note">Título: chance estimada por simulação dos jogos que faltam, com resultados até ${esc(dayShort(asOf))}. É uma estimativa estatística, não uma previsão.</p>` : ""}`;
}

function scoreCell(m) {
  if (m.home_goals != null) return `<span class="s">${m.home_goals} – ${m.away_goals}</span>`;
  const raw = m.score_raw || "";
  if (raw.includes("pen.")) return `<span class="s muted" title="${esc(raw)}">pênaltis</span>`;
  if (raw.includes("a.e.t.")) return `<span class="s muted" title="${esc(raw)}">prorrog.</span>`;
  return `<span class="s muted">${m.time ? esc(m.time) : "–"}</span>`;
}
const shortDay = iso => iso ? (() => { const d = new Date(iso + "T12:00:00"); return d.getDate() + " " + d.toLocaleDateString("pt-BR", { month: "short" }).replace(".", ""); })() : "";
function gameHTML(m, withDate) {
  const hw = m.home_goals != null && m.home_goals > m.away_goals, aw = m.home_goals != null && m.away_goals > m.home_goals;
  return `<li class="g ${withDate ? "wd" : ""}">${withDate ? `<span class="d">${esc(shortDay(m.date))}</span>` : ""}<span class="h ${hw ? "w" : ""}">${esc(short(m.home))}</span>${scoreCell(m)}<span class="a ${aw ? "w" : ""}">${esc(short(m.away))}</span></li>`;
}
function groupByDay(list) {
  const out = []; let last;
  for (const m of list) {
    if (m.date !== last) { out.push({ date: m.date, items: [] }); last = m.date; }
    out[out.length - 1].items.push(m);
  }
  return out.map(g => `<h3 class="day">${g.date ? esc(dayLabel(g.date)) : "Data a definir"}</h3><ul class="games">${g.items.map(gameHTML).join("")}</ul>`).join("");
}

function matchesView(all) {
  const rounds = [...new Set(all.map(m => m.round))];
  if (state.round == null || !rounds.includes(state.round)) {
    // abre na última rodada que já tem resultado: é o que a pessoa mais quer ver
    const played = rounds.filter(r => all.some(m => m.round === r && m.home_goals != null));
    state.round = played.length ? played[played.length - 1] : rounds[0];
  }
  const q = state.team.trim().toLowerCase();
  const filtering = q.length > 0;
  const idx = rounds.indexOf(state.round);
  const shown = filtering
    ? all.filter(m => (m.home + " " + short(m.home) + " " + m.away + " " + short(m.away)).toLowerCase().includes(q))
    : all.filter(m => m.round === state.round);

  const nav = filtering ? "" : `<div class="stepper">
      <button id="prev" aria-label="Rodada anterior" ${idx <= 0 ? "disabled" : ""}>‹</button>
      <select id="round" aria-label="Rodada">${rounds.map(r => `<option value="${esc(r)}" ${r === state.round ? "selected" : ""}>${esc(roundLabel(r))}</option>`).join("")}</select>
      <button id="next" aria-label="Próxima rodada" ${idx >= rounds.length - 1 ? "disabled" : ""}>›</button></div>`;
  const list = shown.length ? (filtering ? `<ul class="games">${shown.map(m => gameHTML(m, true)).join("")}</ul>` : groupByDay(shown))
    : `<div class="state"><h2>Nenhum jogo encontrado.</h2><p>Confira o nome do time ou limpe o filtro.</p><button class="btn" id="clear">Limpar filtro</button></div>`;
  return `<div class="bar">${nav}<input type="search" id="team" placeholder="Filtrar por time" aria-label="Filtrar por time" value="${esc(state.team)}" autocomplete="off"></div>${list}`;
}

const photoOk = u => typeof u === "string" && u.startsWith("https://media.api-sports.io/"); // só aceita o servidor de imagens da fonte
const POS = { Goalkeeper: "Goleiro", Defender: "Defensor", Midfielder: "Meio-campista", Attacker: "Atacante" };
const num = n => n ? Number(n).toLocaleString("pt-BR") : `<span aria-label="zero">–</span>`;
function playerState(e) {
  const m = {
    no_key: ["As estatísticas de jogadores ainda não estão ativadas.", "Cadastre uma chave gratuita da API-Football e adicione na Vercel, em Settings › Environment Variables, com o nome APIFOOTBALL_KEY. Depois faça um novo deploy."],
    plan: ["Essa temporada não está no plano gratuito da fonte.", "O plano gratuito da API-Football cobre só alguns anos (hoje, de 2022 a 2024)."],
    limit: ["O limite diário de consultas da fonte foi atingido.", "As consultas já feitas continuam disponíveis. Tente de novo amanhã."],
    team_not_found: ["Não encontrei esse time na fonte de jogadores.", e.message]
  }[e.code] || ["Não foi possível carregar os jogadores.", "A fonte não respondeu. Tente de novo em instantes."];
  const last = e.code === "plan" && /to (\d{4})/.exec(e.message);
  const btn = last ? `<button class="btn" data-season="${last[1]}">Ver ${last[1]}</button>` : e.code ? "" : `<button class="btn" id="retry">Tentar novamente</button>`;
  return `<div class="state"><h2>${esc(m[0])}</h2><p>${esc(m[1])}</p>${btn}</div>`;
}
function playersTable(d) {
  const key = state.sort, used = d.players.filter(p => p.apps || p.minutes), idle = d.players.length - used.length, rows = [...used].sort((a, b) => (b[key] ?? -1) - (a[key] ?? -1) || a.name.localeCompare(b.name));
  if (!rows.length) return `<div class="state"><h2>Sem estatísticas para ${esc(short(d.team))} em ${d.season}.</h2><p>A fonte não listou jogadores dessa temporada.</p></div>`;
  const th = (k, label, title, x) => `<th scope="col" class="${x ? "x" : ""} ${key === k ? "on" : ""}" aria-sort="${key === k ? "descending" : "none"}"><button class="sort" data-sort="${k}" title="${title}. Ordenar">${label}</button></th>`;
  return `<table class="pl"><caption class="sr">Jogadores do ${esc(short(d.team))} em ${d.season}</caption><thead><tr>
    <th scope="col">Jogador</th>${th("apps", "J", "Jogos")}${th("minutes", "Min", "Minutos jogados", 1)}${th("goals", "Gols", "Gols")}${th("assists", "Ass", "Assistências")}
    ${th("yellow", "CA", "Cartões amarelos", 1)}${th("red", "CV", "Cartões vermelhos", 1)}${th("rating", "Nota", "Nota média da fonte", 1)}</tr></thead><tbody>` +
    rows.map(p => `<tr ${photoOk(p.photo) ? `tabindex="0" data-photo="${esc(p.photo)}" data-name="${esc(p.name)}" data-sub="${esc((POS[p.position] || p.position || "") + (p.age ? " · " + p.age + " anos" : ""))}"` : ""}><td><span class="nm">${esc(p.name)}</span><span class="pos">${esc(POS[p.position] || p.position || "")}${p.age ? " · " + p.age + " anos" : ""}</span></td>
      <td>${num(p.apps)}</td><td class="x">${num(p.minutes)}</td><td><b>${num(p.goals)}</b></td><td>${num(p.assists)}</td>
      <td class="x">${num(p.yellow)}</td><td class="x">${num(p.red)}</td><td class="x">${p.rating ? p.rating.toFixed(1) : "–"}</td></tr>`).join("") + `</tbody></table>` + (idle ? `<p class="note">${idle} jogador${idle > 1 ? "es" : ""} do elenco sem partidas na temporada ${idle > 1 ? "não aparecem" : "não aparece"} aqui.</p>` : "");
}
async function renderPlayers(id) {
  const st = await getData("standings");
  if (id !== reqId) return;
  const teams = st.map(r => r.team).sort((a, b) => short(a).localeCompare(short(b), "pt-BR"));
  $("#out").innerHTML = `<div class="bar"><select id="pteam" aria-label="Time"><option value="">Escolha um time</option>${teams.map(t => `<option value="${esc(t)}" ${t === state.pteam ? "selected" : ""}>${esc(short(t))}</option>`).join("")}</select></div><div id="plist"></div>`;
  const box = $("#plist");
  if (!state.pteam) { box.innerHTML = `<div class="state"><h2>Escolha um time.</h2><p>Mostramos jogos, gols, assistências e cartões de cada jogador na temporada.</p></div>`; return; }
  if (!cache.has(`players|${state.season}|${state.div}|${state.pteam}`)) box.innerHTML = skelHTML();
  try {
    const d = await getData("players", state.pteam);
    if (id === reqId) box.innerHTML = playersTable(d);
  } catch (e) { if (id === reqId) box.innerHTML = playerState(e); }
}

async function render() {
  hideTip();
  writeHash();
  $("#title").textContent = `${DIV_NAME[state.div]} ${state.season}`;
  document.title = `${DIV_NAME[state.div]} ${state.season} · MNSPORT`;
  // sincroniza controles
  document.querySelector(`input[name=division][value=${state.div}]`).checked = true;
  $("#season").value = state.season;
  const cup = state.div === "brcup";
  if (cup && state.view !== "matches") state.view = "matches"; // classificação e elencos só para pontos corridos
  document.querySelector(`input[name=view][value=standings]`).disabled = cup;
  document.querySelector(`input[name=view][value=players]`).disabled = cup;
  document.querySelector(`input[name=view][value=${state.view}]`).checked = true;

  const id = ++reqId;
  if (state.view === "players") {
    if (!cache.has(`standings|${state.season}|${state.div}|`)) skeleton();
    try { await renderPlayers(id); } catch (e) { if (id === reqId) showError(e); }
    return;
  }
  if (!cache.has(`${state.view}|${state.season}|${state.div}|`)) skeleton();
  try {
    const data = await getData(state.view);
    if (id !== reqId) return;
    $("#out").innerHTML = state.view === "standings" ? standingsHTML(data) : matchesView(data);
  } catch (e) { if (id === reqId) showError(e); }
}

/* ---------- eventos ---------- */
for (let y = THIS_YEAR; y >= 2018; y--) $("#season").add(new Option(y, y));
document.querySelectorAll("input[name=division]").forEach(i => i.onchange = () => { state.div = i.value; state.round = null; render(); });
document.querySelectorAll("input[name=view]").forEach(i => i.onchange = () => { state.view = i.value; render(); });
$("#season").onchange = e => { state.season = +e.target.value; state.round = null; render(); };

$("#out").addEventListener("click", e => {
  const t = e.target.closest("[data-team]");
  if (t) { state.team = short(t.dataset.team); state.view = "matches"; render(); return; }
  const o = e.target.closest("[data-sort]");
  if (o) { state.sort = o.dataset.sort; render(); return; }
  const s = e.target.closest("[data-season]");
  if (s) { state.season = +s.dataset.season; state.round = null; render(); return; }
  if (e.target.id === "retry") render();
  if (e.target.id === "clear") { state.team = ""; render(); }
  if (e.target.id === "prev" || e.target.id === "next") {
    const rounds = [...$("#round").options].map(o => o.value);
    state.round = rounds[rounds.indexOf(state.round) + (e.target.id === "next" ? 1 : -1)];
    render();
  }
});
$("#out").addEventListener("change", e => {
  if (e.target.id === "round") { state.round = e.target.value; render(); }
  if (e.target.id === "pteam") { state.pteam = e.target.value; render(); }
});

/* ---------- tooltip com a foto do jogador ---------- */
const tip = document.createElement("div");
tip.id = "tip"; tip.setAttribute("role", "tooltip");
document.body.append(tip);
let tipRow = null, tipTimer;
function initials(n) { return n.split(" ").filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase(); }
function showTip(tr) {
  tipRow = tr;
  const name = tr.dataset.name, img = new Image();
  img.className = "ph"; img.width = img.height = 72; img.alt = ""; img.src = tr.dataset.photo;
  img.addEventListener("error", () => { const f = document.createElement("div"); f.className = "ph"; f.textContent = initials(name); img.replaceWith(f); });
  const box = document.createElement("div");
  const n = document.createElement("div"); n.className = "tn"; n.textContent = name;
  const s = document.createElement("div"); s.className = "ts"; s.textContent = tr.dataset.sub;
  box.append(n, s);
  tip.replaceChildren(img, box);
  tip.classList.add("on");
  const r = tr.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let top = r.top - h - 6; if (top < 8) top = r.bottom + 6;               // acima da linha; se não couber, abaixo
  const left = Math.max(8, Math.min(r.left + 10, innerWidth - w - 8));
  tip.style.top = top + "px"; tip.style.left = left + "px";
}
function hideTip() { clearTimeout(tipTimer); tipRow = null; tip.classList.remove("on"); }
function tipEnter(e) {
  const tr = e.target.closest && e.target.closest("tr[data-photo]");
  if (!tr || tr === tipRow) return;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => showTip(tr), 120); // pequena espera: evita piscar ao varrer a tabela com o mouse
}
$("#out").addEventListener("pointerover", tipEnter);
$("#out").addEventListener("focusin", tipEnter);
$("#out").addEventListener("pointerout", e => { const to = e.relatedTarget; if (!(to && to.closest && to.closest("tr[data-photo]") === tipRow)) hideTip(); });
$("#out").addEventListener("focusout", hideTip);
addEventListener("scroll", hideTip, { passive: true });
addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });

let timer;
$("#out").addEventListener("input", e => {
  if (e.target.id !== "team") return;
  state.team = e.target.value;
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const pos = e.target.selectionStart;
    await render();
    const f = $("#team"); if (f) { f.focus(); f.setSelectionRange(pos, pos); }
  }, 200);
});

render();
</script>
</body>
</html>
